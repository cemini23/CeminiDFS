[package]
name = "sim_kernel_rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "CeminiDFS lineup simulation scoring kernel"

[lib]
name = "sim_kernel_rust"
crate-type = ["cdylib"]

# rustc 1.95 release builds strip debuginfo. On this macOS, dyld then
# rejects the cdylib: "mis-aligned LINKEDIT string pool". Keep symbols.
[profile.release]
strip = "none"

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py311"] }
numpy = "=0.30.0"

[build-dependencies]
pyo3-build-config = "=0.30.1"
