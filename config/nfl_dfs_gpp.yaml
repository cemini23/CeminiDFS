coherence_risk:
  fourth_down:
    enabled: true
  workload:
    enabled: true
simulate:
  enabled: true
  method: copula
  n_iterations: 5000
  seed: 20260913
sim_rerank:
  enabled: true
  candidates: 500
  final_count: 150
  quantile: 0.85
  ownership_penalty: 0.15
ownership:
  enabled: true
  calibration_path: null
buzz_signal:
  enabled: true
  lookback_hours: 24
  limit: 25
  ownership_boost_per_1k: 0.5
  max_ownership_boost: 8.0
# Default player exposure for a GPP book. Nine Week 5 players sat at 34.7%,
# the old 0.35 wall. The exposure hatch lifts one player to 0.30 when his
# projection leads the next player at his position by 4.0 points.
max_exposure: 0.20
# Tiered exposure caps. The flat cap above still applies to a position that the
# tiers do not name (DST and K). A skill player takes the salary tier cap.
# The Week 11 recap showed 23%-35% exposure on cheap and mid-tier RBs and WRs.
exposure_tiers:
  enabled: true
  stud:
    min_salary: 7000
    cap: 0.35
  mid:
    min_salary: 5500
    max_salary: 7000
    cap: 0.20
  value:
    max_salary: 5500
    cap: 0.12
  skill_positions: [QB, RB, WR, TE]
  bad_game_script_rb:
    spread_threshold: 10.0
    cap: 0.10
  role_cliff_cap: 0.10
  player_overrides: {}
gates:
  core:
    enabled: true
    size: 5
    max_count: 12
  low_ceiling:
    enabled: true
    projection_floor: 8.0
    max_per_lineup: 1
    skill_only: true
  exposure_hatch:
    enabled: true
    lead_margin: 4.0
    cap: 0.30
# The pre-lock gate refuses a Q or D player over this exposure share.
# Run `ceminidfs late-swap --prelock` before the 1:00 p.m. ET lock.
prelock:
  q_exposure_cap: 0.08
